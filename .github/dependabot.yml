version: 2
updates:
  # Enable version updates for Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # pnpm rejects lockfile entries published less than 1 day ago; cooldown applies the same floor to transitive updates.
    cooldown:
      default-days: 1
    allow:
      - dependency-type: "all"
    groups:
      all:
        patterns:
          - "*"

  # Enable version updates for rust
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    groups:
      all:
        patterns:
          - "*"
